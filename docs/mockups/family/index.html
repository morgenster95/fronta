<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mud &amp; Iron – náhledy</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #e3d9c3; --muted: #a39782; --bg: #1c1a17; --panel: rgba(28, 26, 23, 0.97); --line: #524a3f;
  --accent: #d98f3f; --blood: #7e3b2a; --a: #8a9295; --b: #c9c26a; --dark: #0e0d0c; --mud: #2b2722;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0e0d0c; color: var(--ink); font: 21px/1.15 'VT323', monospace; }
body { min-height: 100vh; background: radial-gradient(ellipse at 50% 30%, #3d3730, #0e0d0c 70%); }
.sil { font-family: 'Silkscreen', monospace; letter-spacing: .04em; }
.muted { color: var(--muted); }
.sheet { width: min(780px, 100%); margin: 0 auto; background: var(--panel); border: 2px solid var(--line); min-height: 100vh; padding: 16px 16px 28px; position: relative; }
.close { position: absolute; right: 10px; top: 6px; font-size: 28px; color: var(--muted); }
h2 { font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .04em; }
h3 { font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 13px; color: var(--muted); text-transform: uppercase; margin: 22px 0 8px; letter-spacing: .06em; }
.spr { image-rendering: pixelated; display: block; }
.dead { filter: grayscale(1) brightness(.55) sepia(.25); }
button, .btn { font: inherit; color: var(--ink); background: #2b2722; border: 2px solid var(--line); padding: 6px 14px; cursor: pointer; }
.btn.primary { background: var(--blood); border-color: #a85a36; }
.chip { display: inline-block; font-family: 'Silkscreen', monospace; font-size: 11px; padding: 3px 7px; border: 1px solid var(--line); margin: 0 4px 4px 0; color: var(--muted); background: #211f1b; }
.chip.on { color: var(--ink); border-color: var(--accent); background: #3a2a1c; }
.medal { color: var(--accent); }

/* ---------- House ---------- */
.house-head { display: flex; gap: 14px; align-items: center; padding-right: 30px; }
.crest { width: 64px; height: 76px; flex: none; position: relative; }
.crest svg { width: 100%; height: 100%; }
.house-name { font-size: 24px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.stat { background: #211f1b; border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.stat b { display: block; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 20px; color: var(--ink); }
.stat span { font-size: 15px; color: var(--muted); }

/* rodokmen */
.tree { display: flex; align-items: flex-start; justify-content: center; gap: 0; margin: 6px 0 4px; overflow-x: auto; padding: 4px 0 2px; }
.node { width: 96px; flex: none; text-align: center; position: relative; }
.node .frame { width: 64px; height: 64px; margin: 0 auto; border: 2px solid var(--line); background: #2b2722; position: relative; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.node .frame img { width: 56px; height: 56px; }
.node.alive .frame { border-color: var(--accent); box-shadow: 0 0 0 2px #0e0d0c, 0 0 16px rgba(217,143,63,.35); }
.node .cross { position: absolute; top: 2px; right: 4px; font-family: 'Silkscreen', monospace; font-size: 14px; color: var(--ink); text-shadow: 1px 1px #000; }
.node .gen { font-family: 'Silkscreen', monospace; font-size: 9px; color: var(--muted); margin-top: 6px; }
.node .nm { font-size: 18px; line-height: 1; margin-top: 2px; }
.node .yrs { font-size: 15px; color: var(--muted); }
.node.alive .yrs { color: var(--accent); }
.link { flex: none; width: 28px; margin-top: 32px; position: relative; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); }
.link span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--muted); white-space: nowrap; }

/* karty generací */
.gen-card { border: 2px solid var(--line); background: #211f1b; margin-top: 10px; }
.gen-card.alive { border-color: #6b4a2a; }
.gc-head { display: flex; gap: 12px; padding: 10px; align-items: center; }
.gc-head .pf { width: 64px; height: 64px; border: 2px solid var(--line); background: #2b2722; flex: none; display: flex; align-items: flex-end; justify-content: center; }
.gc-head .pf img { width: 60px; height: 60px; }
.gc-title { flex: 1; min-width: 0; }
.gc-title .rk { font-size: 16px; color: var(--muted); }
.gc-title .nm { font-family: 'Silkscreen', monospace; font-size: 15px; line-height: 1.15; }
.status { font-family: 'Silkscreen', monospace; font-size: 10px; padding: 3px 6px; border: 1px solid; white-space: nowrap; align-self: flex-start; }
.status.alive { color: var(--accent); border-color: var(--accent); }
.status.fell { color: var(--ink); border-color: #6b6152; background: #2b2722; }
.gc-body { padding: 0 10px 10px; }
.cause { background: #2a1a16; border-left: 3px solid var(--blood); padding: 6px 10px; margin-bottom: 8px; font-size: 19px; }
.cause .sil { font-size: 10px; color: #c87a5a; display: block; margin-bottom: 2px; }
.mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 6px 0 8px; }
.mini div { text-align: center; font-size: 15px; color: var(--muted); border: 1px dashed #3d3730; padding: 3px 2px; }
.mini b { display: block; font-weight: 400; color: var(--ink); font-size: 20px; }
.quote { font-size: 18px; color: #c4b8a0; font-style: normal; border-top: 1px dashed #3d3730; padding-top: 6px; }
.quote::before { content: '“'; color: var(--accent); }
.quote::after { content: '”'; color: var(--accent); }
.diary-toggle { font-family: 'Silkscreen', monospace; font-size: 11px; color: var(--accent); margin-top: 8px; display: block; }
.diary { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 7px; }
.diary li { font-size: 18px; }
.diary .d { color: var(--accent); font-family: 'Silkscreen', monospace; font-size: 10px; display: block; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* ---------- smrt: oznámení ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8,7,6,.8); display: flex; align-items: center; justify-content: center; padding: 16px; }
.death { width: min(420px, 100%); background: var(--panel); border: 2px solid var(--line); padding: 20px 18px; text-align: center; box-shadow: 0 10px 50px #000; }
.death .ttl { font-family: 'Silkscreen', monospace; font-size: 11px; color: #c87a5a; letter-spacing: .1em; }
.death .pair { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 14px 0 10px; }
.death .pair .frame { width: 92px; height: 92px; border: 2px solid var(--line); background: #2b2722; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.death .pair .frame img { width: 84px; height: 84px; }
.death .pair .frame.new { border-color: var(--accent); }
.death .arrow { font-family: 'Silkscreen', monospace; color: var(--muted); font-size: 18px; }
.death .nm { font-family: 'Silkscreen', monospace; font-size: 15px; margin: 4px 0; }
.death p { margin: 8px 0; font-size: 19px; }
.death .days { font-family: 'Silkscreen', monospace; font-size: 26px; color: var(--accent); }
.death .rank-now { font-size: 16px; color: var(--muted); }

/* ---------- pamětní listina ---------- */
.honour-top { text-align: center; padding: 8px 0 4px; }
.honour-top .wreath { font-size: 34px; color: var(--muted); }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.side-box { border: 1px solid var(--line); padding: 8px; text-align: center; background: #211f1b; }
.side-box b { font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 24px; display: block; }
.day-h { font-family: 'Silkscreen', monospace; font-size: 11px; color: var(--accent); margin: 14px 0 4px; border-bottom: 1px solid #3d3730; padding-bottom: 3px; }
.fallen-row { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px dashed #2f2b26; }
.fallen-row img { width: 36px; height: 36px; }
.fallen-row .nm { font-size: 19px; line-height: 1; }
.fallen-row .sub { font-size: 15px; color: var(--muted); }
.fallen-row .cs { font-size: 15px; text-align: right; color: #c4b8a0; max-width: 150px; }
.dot { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border: 1px solid #0e0d0c; }

/* ---------- žebříčky ---------- */
.tabs { display: flex; gap: 0; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px; border-bottom: 2px solid var(--line); }
.tab { font-family: 'Silkscreen', monospace; font-size: 11px; padding: 8px 10px; color: var(--muted); white-space: nowrap; border: 2px solid transparent; border-bottom: 0; margin-bottom: -2px; }
.tab.on { color: var(--ink); border-color: var(--line); background: #211f1b; border-bottom: 2px solid #211f1b; }
.board-desc { font-size: 17px; color: var(--muted); margin: 10px 0 4px; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 6px; margin: 14px 0 6px; }
.pod { text-align: center; }
.pod img { width: 64px; height: 64px; margin: 0 auto; }
.pod.p1 img { width: 84px; height: 84px; }
.pod .blk { background: #2b2722; border: 2px solid var(--line); border-bottom: 0; padding: 6px 4px 8px; }
.pod.p1 .blk { border-color: var(--accent); padding-bottom: 26px; }
.pod.p2 .blk { padding-bottom: 14px; }
.pod .pl { font-family: 'Silkscreen', monospace; font-size: 18px; color: var(--accent); }
.pod .nm { font-size: 17px; line-height: 1; margin: 2px 0; word-break: break-word; }
.pod .val { font-family: 'Silkscreen', monospace; font-size: 13px; }
.rows { list-style: none; padding: 0; margin: 0; counter-reset: r 3; }
.rows li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed #2f2b26; align-items: center; }
.rows .n { font-family: 'Silkscreen', monospace; font-size: 12px; color: var(--muted); }
.rows .v { font-family: 'Silkscreen', monospace; font-size: 12px; }
.rows .me { background: #3a2a1c; border: 1px solid var(--accent); }
.you { position: sticky; bottom: 0; margin-top: 12px; background: #3a2a1c; border: 2px solid var(--accent); padding: 8px 10px; display: flex; justify-content: space-between; }

/* přehled náhledů */
.index { max-width: 780px; margin: 0 auto; padding: 24px 16px; }
.index a { display: block; margin: 8px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const V = new URLSearchParams(location.search).get('v') || 'house';
const ASSETS = '../../../web/public/assets/soldiers/'; // náhled: npx vite (z kořene repa) → /docs/mockups/family/?v=house|death|honour|boards
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ORD = ['', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th'];
const MEDALS = { 'first-wave': '🎖 First Wave', 'raiders-cross': "✠ Raider's Cross" };
const medal = (m) => MEDALS[m] || (m.startsWith('obj:') ? `🎖 ${m.slice(4) === 'ridge' ? 'Verdel Ridge' : m.slice(4)}` : m);
const dayL = (d) => `Day ${d}`;
// relation = kým byl padlý předchůdce pro nástupce („his uncle X never came home“) → nástupce je pro něj:
const INV = { brother: 'brother', 'older brother': 'younger brother', father: 'son', uncle: 'nephew', cousin: 'cousin' };

fetch('data.json').then((r) => r.json()).then((D) => {
  const T = D.theme;
  const fac = (f) => T.factions[f];
  const role = (id) => T.archetypes.find((a) => a.id === id)?.name ?? id;
  const sprite = (f, arch) => `${ASSETS}${f === 0 ? 'hegemony' : 'concord'}${arch && arch !== 'rifleman' ? '_' + arch : ''}_south.png`;
  const causeText = (c, p) => {
    if (!c) return 'Fell at the front.';
    const where = c.shell ? `Hit in the barrage on ${c.sector}. ` : '';
    return where + ({
      nobed: 'Died on a stretcher outside the aid post. Every bed was taken.',
      wounds: 'Died of wounds in the hospital dugout.',
      raid: `Fell on a night raid${c.place ? ` at ${c.place}` : ''}.`,
      line: 'Fell at the front.',
    })[c.kind];
  };
  const causeShort = (c) => (c?.shell ? 'barrage, ' : '') + ({ nobed: 'no bed', wounds: 'of wounds', raid: 'night raid', line: 'at the front' })[c?.kind || 'line'];
  const H = D.house, F = H.faction, cur = H.current;
  const gens = [
    ...H.fallen.map((p) => ({ ...p, alive: false })),
    { ...cur, alive: true, days: D.day - cur.enlisted, rec: [cur.recFrom, H.record.length], last: H.record.at(-1)?.[1] },
  ];
  const totalDays = gens.reduce((a, g) => a + g.days, 0);
  const honours = gens.reduce((a, g) => a + (g.medals?.length || 0) + (g.titles?.length || 0), 0);
  const crest = (f) => `<svg viewBox="0 0 32 38" class="spr" shape-rendering="crispEdges">
      <path d="M2 2h28v20l-14 14L2 22z" fill="${f === 0 ? '#4a4f52' : '#545639'}" stroke="#0e0d0c" stroke-width="2"/>
      <path d="M4 4h24v17L16 33 4 21z" fill="none" stroke="${fac(f).color}" stroke-width="1"/>
      ${f === 0 ? '<path d="M14 9h4v5h5v4h-5v8h-4v-8H9v-4h5z" fill="#0e0d0c"/><path d="M15 10h2v5h5v2h-5v8h-2v-8h-5v-2h5z" fill="#c4b8a0"/>'
                : '<circle cx="16" cy="17" r="7" fill="none" stroke="#0e0d0c" stroke-width="3"/><circle cx="16" cy="17" r="7" fill="none" stroke="#c9c26a" stroke-width="1.5"/><rect x="15" y="16" width="2" height="2" fill="#c9c26a"/>'}
    </svg>`;
  const app = document.getElementById('app');

  if (V === 'house') {
    const tree = gens.map((g, i) => `
      ${i ? `<div class="link"><span>${esc(INV[g.relation] || 'kin')}</span></div>` : ''}
      <div class="node ${g.alive ? 'alive' : ''}">
        <div class="frame"><img class="spr ${g.alive ? '' : 'dead'}" src="${sprite(F, g.archetype)}">${g.alive ? '' : '<span class="cross">✝</span>'}</div>
        <div class="gen">${ORD[g.gen] || g.gen + 'th'} GENERATION</div>
        <div class="nm">${esc(g.first || g.name.split(' ')[0])}</div>
        <div class="yrs">${g.alive ? `Day ${g.enlisted} → now` : `Day ${g.enlisted}–${g.day}`}</div>
      </div>`).join('');
    const cards = gens.slice().reverse().map((g, i) => {
      const entries = H.record.slice(g.rec[0], g.rec[1]);
      const med = [...(g.medals || []).map(medal), ...(g.titles || []).map((t) => `★ ${t}`)];
      return `<div class="gen-card ${g.alive ? 'alive' : ''}">
        <div class="gc-head">
          <div class="pf"><img class="spr ${g.alive ? '' : 'dead'}" src="${sprite(F, g.archetype)}"></div>
          <div class="gc-title">
            <div class="rk">${esc(T.ranks[g.rank])} · ${esc(role(g.archetype))}</div>
            <div class="nm">${esc(g.name)}</div>
            <div class="muted" style="font-size:16px">${ORD[g.gen] || g.gen + 'th'} of the House${g.relation ? ` · ${esc(gens[gens.indexOf(g) - 1]?.first || '')}'s ${esc(INV[g.relation] || 'kin')}` : ' · founder'}</div>
          </div>
          <span class="status ${g.alive ? 'alive' : 'fell'}">${g.alive ? 'ON THE LINE' : `✝ DAY ${g.day}`}</span>
        </div>
        <div class="gc-body">
          ${g.alive ? '' : `<div class="cause"><span class="sil">CAUSE OF DEATH</span>${esc(causeText(g.cause, g))}</div>`}
          <div class="mini">
            <div><b>${g.days}</b>days</div><div><b>${g.wounds ?? 0}</b>wounds</div><div><b>${g.scars ?? 0}</b>scars</div>
            <div><b>${g.treated ?? 0}</b>patients</div><div><b>${g.raids ?? 0}</b>raids</div>
          </div>
          ${med.length ? `<div>${med.map((m) => `<span class="chip on medal">${esc(m)}</span>`).join('')}</div>` : '<div class="muted" style="font-size:16px">No decorations.</div>'}
          ${g.last ? `<div class="quote">${esc(g.last)}</div>` : ''}
          <span class="diary-toggle">${i === 1 ? '▾' : '▸'} SERVICE RECORD · ${entries.length} ENTRIES</span>
          ${i === 1 ? `<ol class="diary">${entries.slice().reverse().slice(0, 4).map(([d, t]) => `<li><span class="d">${dayL(d)}</span>${esc(t)}</li>`).join('')}</ol>` : ''}
        </div>
      </div>`;
    }).join('');
    app.innerHTML = `<section class="sheet">
      <span class="close">×</span>
      <div class="house-head">
        <div class="crest">${crest(F)}</div>
        <div>
          <div class="sil muted" style="font-size:11px">${esc(fac(F).name.toUpperCase())}</div>
          <h2 class="house-name">House of ${esc(H.family)}</h2>
          <div class="muted">@${esc(H.handle)} · your family at the front</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b>${gens.length}</b><span>generations</span></div>
        <div class="stat"><b>${totalDays}</b><span>days at the front</span></div>
        <div class="stat"><b>${H.fallen.length}</b><span>fallen</span></div>
        <div class="stat"><b>${honours}</b><span>honours</span></div>
      </div>
      <h3>Family tree</h3>
      <div class="tree">${tree}</div>
      <h3>The generations</h3>
      ${cards}
      <div class="actions"><button class="btn primary">Share the House</button><button class="btn">Roll of Honour</button><button class="btn">Leaderboards</button></div>
    </section>`;
  }

  if (V === 'death') {
    const p = H.fallen.at(-1);
    app.innerHTML = `<section class="sheet" style="filter:blur(2px) brightness(.6)"><h2>MUD &amp; IRON</h2><p class="muted">…the front…</p></section>
    <div class="overlay"><div class="death">
      <div class="ttl">✝ NEWS FROM THE FRONT · DAY ${p.day}</div>
      <div class="pair">
        <div><div class="frame"><img class="spr dead" src="${sprite(F, p.archetype)}"></div><div class="nm">${esc(p.first)}</div></div>
        <div class="arrow">▸</div>
        <div><div class="frame new"><img class="spr" src="${sprite(F, cur.archetype)}"></div><div class="nm">${esc(cur.first)}</div></div>
      </div>
      <p><b>${esc(p.name)}</b> fell on Day ${p.day}.</p>
      <p class="muted">${esc(causeText(p.cause, p))}</p>
      <div class="days">${p.days} DAYS</div>
      <div class="rank-now">at the front · #${7} longest on the Concord line this week</div>
      <p style="margin-top:14px">His ${esc(INV[cur.relation] || 'kin')} <b>${esc(cur.name)}</b> has taken up the rifle. ${esc(role(cur.archetype))}, Day 1 of his war.</p>
      <div class="actions" style="justify-content:center"><button class="btn primary">Meet ${esc(cur.first)}</button><button class="btn">House of ${esc(H.family)}</button></div>
      <p class="muted" style="font-size:15px">Share his memory: <span style="color:var(--accent)">Story card ▸</span></p>
    </div></div>`;
  }

  if (V === 'honour') {
    const by = {};
    for (const r of D.honour) (by[r.day] ||= []).push(r);
    const cnt = [0, 1].map((f) => D.honour.filter((r) => r.faction === f).length);
    app.innerHTML = `<section class="sheet">
      <span class="close">×</span>
      <div class="honour-top">
        <div class="wreath">✝</div>
        <h2>Roll of Honour</h2>
        <div class="muted">Every soldier who fell on the front. Their houses fight on.</div>
      </div>
      <div class="sides">
        ${[0, 1].map((f) => `<div class="side-box"><b style="color:${fac(f).color}">${cnt[f]}</b><span class="muted">${esc(fac(f).name)} fallen</span></div>`).join('')}
      </div>
      <div><span class="chip on">ALL</span><span class="chip">HEGEMONY</span><span class="chip">CONCORD</span><span class="chip">MY HOUSE</span></div>
      ${Object.keys(by).sort((a, b) => b - a).map((d) => `<div class="day-h">DAY ${d}</div>` + by[d].map((r) => `
        <div class="fallen-row">
          <img class="spr dead" src="${sprite(r.faction, r.archetype)}">
          <div><div class="nm"><span class="dot" style="background:${fac(r.faction).color}"></span>${esc(r.name)}</div>
            <div class="sub">@${esc(r.handle)} · ${esc(role(r.archetype))} · ${r.days} days · House of ${esc(r.family)}${r.gen > 1 ? ` (${ORD[r.gen]})` : ''}</div></div>
          <div class="cs">${esc(causeShort(r.cause))}</div>
        </div>`).join('')).join('')}
    </section>`;
  }

  if (V === 'boards') {
    const B = D.boards.longest;
    const lab = (r) => `${r.value} days`;
    const pod = (r, cls, pl) => r ? `<div class="pod ${cls}">
        <img class="spr" src="${sprite(r.faction)}">
        <div class="blk"><div class="pl">${pl}</div><div class="nm">${esc(r.name)}</div><div class="muted" style="font-size:14px">@${esc(r.handle)}</div><div class="val" style="color:${fac(r.faction).color}">${lab(r)}</div></div>
      </div>` : '<div></div>';
    app.innerHTML = `<section class="sheet">
      <span class="close">×</span>
      <h2>Leaderboards</h2>
      <div class="tabs">
        <span class="tab on">LONGEST ALIVE</span><span class="tab">OLDEST HOUSES</span><span class="tab">MOST DECORATED</span><span class="tab">SURVIVORS</span><span class="tab">MEDICS</span>
      </div>
      <div class="board-desc">Days at the front without dying. When a soldier falls, his heir starts again from Day 1.</div>
      <div><span class="chip on">ALL</span><span class="chip">HEGEMONY</span><span class="chip">CONCORD</span></div>
      <div class="podium">${pod(B[1], 'p2', '2')}${pod(B[0], 'p1', '1')}${pod(B[2], 'p3', '3')}</div>
      <ol class="rows">
        ${B.slice(3, 10).map((r, i) => `<li><span class="n">${i + 4}</span><span><span class="dot" style="background:${fac(r.faction).color}"></span>${esc(r.name)} <span class="muted" style="font-size:15px">@${esc(r.handle)}</span></span><span class="v">${lab(r)}</span></li>`).join('')}
      </ol>
      <div class="you"><span><span class="sil" style="font-size:11px;color:var(--accent)">YOU · #23</span> ${esc(cur.name)}</span><span class="sil" style="font-size:12px">${D.day - cur.enlisted} days</span></div>
    </section>`;
  }
});
</script>
</body>
</html>
