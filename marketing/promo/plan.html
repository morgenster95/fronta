caption":"How to enlist in 10 seconds 🪖","full":"How to enlist in 10 seconds 🪖\n1️⃣ Follow @mudandiron\n2️⃣ Comment CONCORD or HEGEMONY under the pinned reel\n3️⃣ Find your soldier on the front: link in bio\n\nEvery day the front changes. Every day you vote on what happens next.\n\n#pixelart #ww1 #howto #indiegame #mudandiron","trigger":null,"published":null},{"id":"poster-concord","label":"","type":"image","at":"2026-11-13T23:00:00Z","files":["06_enlist_concord.jpg"],"caption":"STAND TOGETHER. 🫒","full":"STAND TOGETHER. 🫒\nThe Alliance needs every hand. Comment CONCORD and take your post.\n\n#pixelart #ww1 #concord #mudandiron","trigger":null,"published":null},{"id":"reel-story","label":"","type":"reel","at":null,"files":["reel_story.mp4"],"caption":"Six winters. One valley of mud. The war that never ended. 🪖","full":"Six winters. One valley of mud. The war that never ended. 🪖\n\nMud & Iron is a war fought by Instagram followers.\nComment your side and a soldier with YOUR name takes a post on the front, for good.\n\n⚔️ Every soldier gets a role, a rank and a service record written day by day\n🌑 Every midnight the front turns: wounds, promotions, the fallen\n🩸 Fall, and the next of your family picks up the rifle\n🗳️ Vote in the comments and decide what happens next\n💥 500 claimed soldiers unlock the artillery\n🎖️ The first 100 recruits wear the First Wave medal forever\n\nComment CONCORD or HEGEMONY below 👇\nFind yourself on the front: link in bio.\n\n#pixelart #ww1 #indiegame #trenchwarfare #gamedev #pixelartgame #grimdark #interactivegame #instagramgame #mudandiron","trigger":null,"published":{"at":"2026-11-08T23:03:41.198Z","link":"https://www.instagram.com/reel/Dff5CQYiCTl/"}},{"id":"reel-day1","label":"Day reel","type":"reel","at":"2026-11-09T13:12:12.382Z","files":["reel_day1.mp4"],"caption":"Day 1 on Verdel Ridge. 🪖","full":"Day 1 on Verdel Ridge. 🪖\nYesterday they were strangers. Tonight 32 of them hold the line: 18 for the Hegemony, 14 for the Concord.\n\n⚔️ THE RACE FOR VERDEL RIDGE\nFirst side to 100 soldiers takes the heights: 3 days of artillery on the enemy, a safer week for every soldier who fought, and the title of Hero for the recruit who tips the balance.\n\n📰 Every morning at 13:00 UTC the Trench Gazette prints what happened on the line. If your name is in it, you were there.\n\nEvery friend you bring is one more rifle.\n🩶 comment HEGEMONY · 🫒 comment CONCORD\nFind yourself: link in bio.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":null,"published":{"at":"2026-11-09T13:18:23.920Z","link":"https://www.instagram.com/reel/Dfha2PzFxro/"}},{"id":"story-day1-1","label":"","type":"story","at":null,"files":["story_day1_1.mp4"],"caption":"","full":"","trigger":null,"published":{"at":"2026-11-09T13:36:09.203Z","link":"https://www.instagram.com/stories/mudandiron/4026626701375125159"}},{"id":"story-day1-2","label":"","type":"story","at":null,"files":["story_day1_2.mp4"],"caption":"","full":"","trigger":null,"published":{"at":"2026-11-09T13:36:58.353Z","link":"https://www.instagram.com/stories/mudandiron/4026627117113561390"}},{"id":"victory-ridge","label":"","type":"carousel","at":null,"files":["victory_ridge_concord_1.jpg","victory_ridge_concord_2.jpg"],"caption":"🫒 VERDEL RIDGE HAS FALLEN. Now your side votes: comment FORTIFY or HOSPITAL below 👇","full":"🫒 VERDEL RIDGE HAS FALLEN. Now your side votes: comment FORTIFY or HOSPITAL below 👇\n\nThe Concord reached 100 soldiers first (100 against 94) and took the heights. The deciding rifle belonged to jro_se11, now Hero of Verdel Ridge. 🎖️\n\nFor 3 days the guns on the ridge pound the Hegemony lines. For a week the high ground keeps the Concord safer. Every Concord soldier wears the ribbon.\n\n🗳️ NOW EACH SIDE CHOOSES WHAT TO BUILD\nComment one word below. Your soldier is your ballot: we know which side you serve, so no need to write it.\n\n🧱 FORTIFY: sandbag parapets, fewer men hit\n🏥 HOSPITAL: a hospital dugout, 4 more beds. Without a free bed, the badly wounded wait on stretchers\n\nThe Concord vote for the Concord. The Hegemony vote for the Hegemony. Built and announced in the Trench Gazette at 13:00 UTC.\nNot enlisted yet? Comment CONCORD or HEGEMONY together with your choice.\n\n⚔️ The race for Hill 304 starts now. First side to 100 new recruits takes it.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":"race: ridge","published":{"at":"2026-11-11T21:57:25.552Z","link":"https://www.instagram.com/p/Dfnf63qFCNV/"}},{"id":"vote-build-d2","label":"","type":"image","at":"2026-11-10T12:41:35.178Z","files":["vote_build_2.jpg"],"caption":"🗳️ YOUR SIDE BUILDS ONE. Comment one word below 👇","full":"🗳️ YOUR SIDE BUILDS ONE. Comment one word below 👇\n\n🏥 HOSPITAL: a hospital dugout. 4 beds instead of 2, fewer men die of their wounds.\n🧱 SANDBAGS: higher parapets. Fewer men hit, for good.\n\nEach side votes for itself. Your soldier is your ballot: we know which side you serve, so no need to write it. A side that sends no votes builds nothing.\n\nBuilt and announced in the Trench Gazette tomorrow at 13:00 UTC.\nNot enlisted yet? Comment HEGEMONY or CONCORD together with your choice.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":null,"published":{"at":"2026-11-10T12:46:15.145Z","link":"https://www.instagram.com/p/Dfj8DfWDIiT/"}},{"id":"casualties-d2","label":"","type":"carousel","at":"2026-11-10T12:34:00.000Z","files":["day2_wounded_1.jpg","day2_wounded_2.jpg","day2_wounded_3.jpg"],"caption":"🩸 DAY 2: FIRST BLOOD ON VERDEL RIDGE","full":"🩸 DAY 2: FIRST BLOOD ON VERDEL RIDGE\n\nThe big guns are still silent. The rifles are not. Five men were hit overnight.\n\n🩶 HEGEMONY: 3 hit\n• @0__freddie__0 badly wounded, shot by @ghai.gpt of the Concord. Now in a bed at the aid post.\n• @slightlyretarded69 grazed, shot by @leo.glc\n• @wolfmanantony grazed, shot by @csllgaks\n\n🫒 CONCORD: 2 hit\n• @pavla.9_ and @the_cowboii grazed by stray bullets\n\nEach side has only an aid post with 2 beds. When they fill, the badly wounded wait on stretchers in the mud. No side has a hospital yet.\n🗳️ Today at 15:00 UTC each side votes what to build. Watch this account.\n\nRead the Trench Gazette and find your soldier: link in bio.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":null,"published":{"at":"2026-11-10T12:35:23.458Z","link":"https://www.instagram.com/p/Dfj6z8zjtXc/"}},{"id":"reel-news","label":"","type":"reel","at":"2026-11-11T09:00:00Z","files":["reel_news.mp4"],"caption":"NEW ON THE FRONT 🪖","full":"NEW ON THE FRONT 🪖\n\n🎯 Every rifle on the line is a real player, and now every shot can hit one. Hit someone and it goes in both your service records.\n⚔️ Ten trades: snipers, machine gunners, stretcher bearers, sappers, cooks… every one of them matters.\n🎖️ Every day at the front makes you better: Recruit → Seasoned → Veteran → Elite.\n🏥 The badly wounded need a bed. Each side has an aid post with only two. Follow the red cross on the map.\n🗳️ Each side votes what to build: HOSPITAL or SANDBAGS. Find the vote post on our profile. Voting closes today at 13:00 UTC.\n🕯️ Fall, and your house fights on. Your heir takes the rifle.\n🏅 Longest alive, best shots, oldest houses: it's all in the Ranks.\n\nComment CONCORD or HEGEMONY to enlist. Find your soldier: link in bio.\n\n#pixelart #ww1 #indiegame #gamedev #trenchwarfare #instagramgame #mudandiron","trigger":null,"published":{"at":"2026-11-11T09:03:44.147Z","link":"https://www.instagram.com/reel/DfmHS-VD06p/"}},{"id":"reel-day2","label":"Day reel","type":"reel","at":"2026-11-10T17:53:17.210Z","files":["reel_day2.mp4"],"caption":"Day 2 on Verdel Ridge. 🪖","full":"Day 2 on Verdel Ridge. 🪖\nThe big guns are silent. The rifles are not.\n\n🪖 136 soldiers now hold the line: 63 for the Hegemony, 73 for the Concord.\n\n🎯 One shot from a Concord sniper. A Hegemony machine gunner, badly wounded, now in a bed at ment CONCORD or HEGEMONY first, and your soldier takes a post on the line.\n\n#pixelart #ww1 #lettershome #indiegame #gamedev #trenchwarfare #mudandiron","trigger":null,"published":null},{"id":"council-ridge","label":"","type":"image","at":"2026-11-11T22:18:00Z","files":["council_1.jpg"],"caption":"FRONT COUNCIL 🗺️","full":"FRONT COUNCIL 🗺️\n\nVerdel Ridge has fallen. The guns are talking. Now it's your turn.\n\nWhat should your side do next? Write your idea in the comments. Big or small, serious or crazy, as long as it fits the war:\n⚔️ an attack, a trap, a raid\n🏥 a way to save more men\n🧱 something to build\n📣 anything the front would remember\n\nThe most liked idea of each side becomes an order in the game, and is announced in the Trench Gazette. ❤️ Like the ideas you want to see happen.\n\nYour soldier is your voter: we know which side you serve, so no need to write it. Not enlisted yet? Comment CONCORD or HEGEMONY first, and then your idea.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":null,"published":{"at":"2026-11-11T22:19:01.014Z","link":"https://www.instagram.com/p/DfniZGbFPG1/"}},{"id":"story-council","label":"","type":"story","at":"2026-11-11T22:29:00Z","files":["story_council.jpg"],"caption":"","full":"","trigger":null,"published":{"at":"2026-11-11T22:29:53.019Z","link":"https://www.instagram.com/stories/mudandiron/4028345121850548348"}},{"id":"reel-ridge","label":"Day reel","type":"reel","at":"2026-11-12T10:00:00Z","files":["reel_ridge.mp4"],"caption":"VERDEL RIDGE HAS FALLEN 🎖️","full":"VERDEL RIDGE HAS FALLEN 🎖️\n\nThe Concord reached 100 soldiers first (100 against 94) and took the heights. The deciding rifle: Lucien Jro, a field cook, now Hero of Verdel Ridge with the Medal of Valor.\n\nFor 3 nights the guns on the ridge pound the Hegemony lines. The Concord hold the high ground for a week. 65 new soldiers joined the front since the last report.\n\n🪖 222 soldiers on the front right now: 108 Hegemony, 114 Concord.\n\n🗺️ WHAT HAPPENS NEXT? The vote is in our FRONT COUNCIL post on this profile. Comment your idea for what your side should do, and like the ideas you want to see. The most liked idea of each side becomes an order.\n\nNot enlisted yet? Comment CONCORD or HEGEMONY under any post.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":null,"published":{"at":"2026-11-12T10:05:26.364Z","link":"https://www.instagram.com/reel/DfozJ31j-GZ/"}},{"id":"vote-orders-d4","label":"","type":"image","at":null,"files":["vote_orders_1.jpg"],"caption":"THE FRONT DECIDES ⚔️","full":"THE FRONT DECIDES ⚔️\n\nVerdel Ridge is in Concord hands, and the Hegemony lines are under the guns. Now the front chooses its next order. One post, one vote, three choices.\n\nComment ONE word:\n🧱 DUGOUTS: deep shelters. Fewer men hit by shells and by fire.\n🩺 DOCTOR: a surgeon arrives. Fewer dead and faster healing.\n📦 AMMO: an ammunition train arrives. Your shooters hit 40% more.\n\nYour soldier is your vote: we know which side you serve, so no need to write it. Each side counts its own votes, so the two sides can choose differently. Not enlisted yet? Comment CONCORD or HEGEMONY together with your choice.\n\nThe winning order of each side is announced in the Trench Gazette at 13:00 UTC.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":null,"published":null},{"id":"reel-rip","label":"","type":"reel","at":"2026-11-12T18:00:00Z","files":["reel_rip.mp4"],"caption":"R.I.P. 🪦 THE FIRST NIGHT OF THE BARRAGE","full":"R.I.P. 🪦 THE FIRST NIGHT OF THE BARRAGE\n\n5 soldiers of the Hegemony did not see the morning: Bram Yoollyfox, Pavel Zulfi, Nils Wolfmananton, Oskar Brunoescobar, Lucien Jewnipers. The Concord buried 1 too: Henrik Eccentricred.\n\nBut no name dies out here. That same night Dorian Yoollyfox reported for duty, the second of the House of Yoollyfox. Every fall is written in the family tree. Open your soldier's card in the game and read your house.\n\n🪖 251 soldiers on the front right now: 127 Hegemony, 124 Concord.\n\nNot enlisted yet? Comment CONCORD or HEGEMONY under any post and your soldier takes a post on the line.\n\n#pixelart #ww1 #indiegame #trenchwarfare #instagramgame #gamedev #mudandiron","trigger":null,"published":null}],"losses":{"day":4,"sides":[{"name":"Hegemony","dead":5,"light":9,"heavy":11,"crit":6,"shell":15},{"name":"Concord","dead":1,"light":13,"heavy":4,"crit":2,"shell":0}]},"now":[{"name":"Hegemony","wounded":22,"missing":1},{"name":"Concord","wounded":19,"missing":1}],"victory":{"name":"Verdel Ridge","faction":"Concord","day":3,"to":6,"loser":"Hegemony"},"pages":"https://morgenster95.github.io/fronta","slots":{"gazette":13,"evening":23}};
const fmt=(d,tz)=>new Intl.DateTimeFormat('cs-CZ',{timeZone:tz,weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
const both=(d)=>fmt(d,'Europe/Prague')+' (Praha) · '+d.toISOString().slice(11,16)+' UTC';
const left=(d)=>{let s=Math.round((d-Date.now())/60000);if(s<=0)return 'právě teď / už mělo vyjít';const h=Math.floor(s/60),m=s%60;return 'za '+(h?h+' h ':'')+m+' min'};
const esc=(s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const media=(i)=>i.files.map(f=>/\.mp4$/i.test(f)?'<video controls preload="none" playsinline src="'+D.pages+'/'+f+'"></video>':'<img class="pv" loading="lazy" src="'+D.pages+'/'+f+'" alt="">').join('');
function gazette(){const n=new Date();let g=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),D.slots.gazette));if(g<=n)g=new Date(g.getTime()+864e5);return g}
function render(){
  document.getElementById('clock').textContent='Teď: '+both(new Date());
  const now=Date.now(),g=gazette(),dayN=D.day+1;
  const ev=[];
  ev.push({at:g,html:'<div class="card sys"><div class="t">📰 Noviny (Den '+dayN+')'+'<span class="badge go">automaticky</span></div><div class="when">'+both(g)+' · '+left(g)+'</div><div class="dim">Denní tah, zápisy vojákům, The Trench Gazette'+(D.victory&&dayN<=D.victory.to?', bombardování '+D.victory.loser+' (noc '+(dayN-D.victory.day)+' ze 3)':'')+'</div></div>'});
  for(const i of D.items){ if(!i.at||i.published)continue; const d=new Date(i.at);
    ev.push({at:d,html:'<div class="card"><div class="t">'+(i.type==='reel'?'🎬':i.type==='story'?'📱':'🖼️')+' '+(i.label?esc(i.label)+' · ':'')+esc(i.id)+'<span class="badge go">naplánováno</span></div><div class="when">'+both(d)+' · '+left(d)+'</div><div class="dim">'+esc(i.caption)+'</div>'+media(i)+'<details><summary>celý popisek</summary><pre>'+esc(i.full)+'</pre></details></div>'});}
  ev.sort((a,b)=>a.at-b.at);
  let h='<h2>Co přijde (v pořadí)</h2>'+ev.map(e=>e.html).join('');
  const free=D.items.filter(i=>!i.at&&!i.published);
  h+='<h2>Připraveno bez termínu</h2>'+(free.map(i=>'<div class="card free"><div class="t">'+esc(i.id)+' <span class="badge">'+i.type+(i.trigger?' · spouštěč '+esc(i.trigger):'')+'</span></div><div class="dim">'+esc(i.caption)+'</div>'+media(i)+'</div>').join('')||'<div class="dim">nic</div>');
  const done=D.items.filter(i=>i.published).sort((a,b)=>b.published.at.localeCompare(a.published.at)).slice(0,8);
  h+='<h2>Vyšlo</h2>'+done.map(i=>'<div class="card done"><div class="t">'+(i.label?esc(i.label)+' · ':'')+esc(i.id)+'<span class="badge ok">vyšlo</span></div><div class="when">'+both(new Date(i.published.at))+'</div>'+(i.published.link?'<a href="'+i.published.link+'" target="_blank" rel="noopener">otevřít na Instagramu</a>':'')+'</div>').join('');
  if(D.losses){h+='<h2>Ztráty posledního vydání (Den '+D.losses.day+')</h2><table><tr><th></th><th>padlí</th><th>lehce</th><th>těžce</th><th>kriticky</th><th>z bombardování</th></tr>'+D.losses.sides.map(s=>'<tr><td>'+s.name+'</td><td>'+s.dead+'</td><td>'+s.light+'</td><td>'+s.heavy+'</td><td>'+s.crit+'</td><td>'+s.shell+'</td></tr>').join('')+'</table>';}
  h+='<h2>Stav teď</h2><table><tr><th></th><th>ranění</th><th>nezvěstní</th></tr>'+D.now.map(s=>'<tr><td>'+s.name+'</td><td>'+s.wounded+'</td><td>'+s.missing+'</td></tr>').join('')+'</table>';
  h+='<h2>Odkazy</h2><div class="dim"><a href="https://mudandiron.web.app" target="_blank">hra</a> · <a href="https://www.instagram.com/mudandiron/" target="_blank">Instagram</a></div>';
  document.getElementById('app').innerHTML=h;
}
render();setInterval(render,30000);
</script></body></html>
