# Nasazení pravidel Firestore (firestore.rules) při jejich změně nebo ručně. Používá stejný servisní účet jako smyčka.
name: deploy-rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firestore.rules']
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g firebase-tools@14
      - name: Deploy rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only firestore:rules --non-interactive --project fronta-ig 2>&1 | grep -vE "Authorization|access_token" | tail -30
          exit ${PIPESTATUS[0]}
