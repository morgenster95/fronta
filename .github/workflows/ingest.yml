# Každých 30 min: stáhne komentáře z IG, narukuje vojáky, uloží stav do repa a nasadí web.
# Interval 30 min = cca 1 500 min/měsíc → vejde se do 2 000 bezplatných minut soukromého repa.
# (Veřejné repo má minuty neomezené → lze dát */5.)
name: ingest
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  ingest:
    if: ${{ vars.IG_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Poll Instagram comments
        if: ${{ env.IG_ACCESS_TOKEN != '' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_MEDIA_IDS: ${{ vars.IG_MEDIA_IDS }}
          IG_SEND_DM: ${{ vars.IG_SEND_DM }}
          IG_REPLY: ${{ vars.IG_REPLY }}
          SITE_URL: ${{ vars.SITE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE: ${{ vars.FIRESTORE }}
        run: npm run ingest
      - run: npm run data:build
      - name: Commit state
        run: |
          git config user.name "front-bot"
          git config user.email "front-bot@users.noreply.github.com"
          git add data/state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "ingest: state $(date -u +%FT%TZ)" && git push)
      - run: npm run build
      - name: Deploy to Firebase Hosting
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@14 deploy --only hosting --non-interactive
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
