# Přehled komentářů na IG, kde hráči hlásí chyby nebo se ptají (jen čte). Spustit ručně; výsledek je v logu.
name: comments-scan
on:
  workflow_dispatch:
    inputs:
      days: { description: 'Kolik dní zpátky', default: '3' }
      posts: { description: 'Kolik posledních postů', default: '20' }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ingest/comments-scan.mjs "${{ inputs.days }}" "${{ inputs.posts }}"
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
